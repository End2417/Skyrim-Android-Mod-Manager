# Reduced copy of the LOOT masterlist: only the groups and the group / load-after data of each plugin are kept.
groups:
  - name: 'Update.esm'
  - name: 'Unofficial Patches'
    after: [ 'Update.esm' ]
  - name: 'DLC'
    after: [ 'Unofficial Patches' ]
  - name: 'New Lands & Optimisers'
    after: [ 'DLC' ]
  - name: 'Underrides'
    after: [ 'New Lands & Optimisers' ]
  - name: 'default'
    after: [ 'Underrides' ]
  - name: 'Ordinator'
    after: [ 'default' ]
  - name: 'Pre-Patchus Maximus Patches'
    after: [ 'Ordinator' ]
  - name: 'Immersive Citizens'
    after: [ 'Pre-Patchus Maximus Patches' ]
  - name: 'Morrowloot'
    after: [ 'Immersive Citizens' ]
  - name: 'Requiem'
    after: [ 'Morrowloot' ]
  - name: 'Open Cities Skyrim'
    after: [ 'Requiem' ]
  - name: 'Alternate Start & Requiem'
    after: [ 'Open Cities Skyrim' ]
  - name: 'Skyrim Unlocked'
    after: [ 'Alternate Start & Requiem' ]
  - name: 'Cell Music'
    after: [ 'Skyrim Unlocked' ]
  - name: 'Lighting'
    after: [ 'Cell Music' ]
  - name: 'Dynamic Patches'
    after: [ 'Lighting' ]
  - name: 'Map Markers'
    after: [ 'Dynamic Patches' ]
  - name: 'ASIS'
    after: [ 'Map Markers' ]
  - name: 'Late Patches'
    after: [ 'ASIS' ]
  - name: 'SkyProc Unified Manager'
    after: [ 'Late Patches' ]
  - name: 'Reproccer Patches'
    after: [ 'SkyProc Unified Manager' ]
  - name: 'Post-Reproccer Patches'
    after: [ 'Reproccer Patches' ]
  - name: 'Maps & LOD'
    after: [ 'Post-Reproccer Patches' ]
