      # Writes the project's source files into the repository root so they can be browsed and read on GitHub.
      - name: Commit the source files to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source files are already up to date."
          else
            git commit -m "Update source files (build ${{ github.run_number }})"
            git push
          fi

      # The signing key is never stored in the repository: it is rebuilt from two repository secrets.
      - name: Load the signing key from repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing repository secrets KEYSTORE_BASE64 and/or KEYSTORE_PASSWORD. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Keep only the long base64 token, so stray labels, quotes or line breaks added by copy and paste don't matter.
          B64=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:cntrl:]' | grep -oE '[A-Za-z0-9+/=]{300,}' | head -1 || true)
          echo "KEYSTORE_BASE64 has ${#KEYSTORE_BASE64} characters in total, ${#B64} of them usable base64 (a correct value is about 3500)."
          if ! printf '%s' "$B64" | base64 -d > app/skyrimmm.keystore 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 is not valid base64. It was most likely cut off or changed when pasted. Delete the secret and paste the full value again."
            exit 1
          fi
          if ! keytool -list -keystore app/skyrimmm.keystore -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::The keystore could not be opened. Check that KEYSTORE_PASSWORD is exactly the password from signing-secrets.txt, and that KEYSTORE_BASE64 is complete."
            exit 1
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease -PversionCode=$(( $(date +%s) / 60 )) -PversionName=$APP_VERSION -PrepoSlug=${{ github.repository }} --stacktrace

      - name: Check the APK is valid and signed with the fixed key
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ls -l "$APK"
          "$BT/apksigner" verify --print-certs "$APK" | head -4
          "$BT/aapt2" dump badging "$APK" | head -1

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk SkyrimModManager-v${{ env.APP_VERSION }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SkyrimMM-apk
          path: SkyrimModManager-v${{ env.APP_VERSION }}.apk
