name: Build Skyrim Mod Manager APK

# Self-contained: this one file holds the whole project. Run it (Actions tab > Run workflow,
# or just commit it) and it writes the source files, builds the APK and attaches it to the run as an artifact.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: '1.3.6'   # shown in the app and in the APK file name; change it for each release

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner already ships the Android SDK; just make sure its licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Extract project files
