name: Build Skyrim Mod Manager APK

# The app's source lives in a .zip in the repository root (any name). Upload the zip and this workflow unpacks it (and deletes the zip after a good build) into the
# repository root, commits the files so they can be browsed on GitHub, builds the APK and attaches it to the run as an artifact.
# It only runs when you start it: Actions tab > this workflow > Run workflow. Pushing to the repository does not start it.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner already ships the Android SDK; just make sure its licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Find the source zip
        run: |
          set -e
          # Any .zip in the repository root; the name does not matter. If there are several, the one added last is used.
          mapfile -t ZIPS < <(for z in ./*.[zZ][iI][pP]; do [ -f "$z" ] && printf '%s %s\n' "$(git log -1 --format=%ct -- "$z")" "${z#./}"; done | sort -n | cut -d' ' -f2-)
          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::No source zip found in the repository root. Upload it there and run again."
            exit 1
          fi
          SOURCE_ZIP="${ZIPS[-1]}"
          if [ "${#ZIPS[@]}" -gt 1 ]; then echo "::warning::Several zips found (${ZIPS[*]}); using $SOURCE_ZIP."; fi
          BASE="${SOURCE_ZIP%.[zZ][iI][pP]}"
          APP_NAME="${BASE%-source}"
          APP_VERSION=$(printf '%s' "$BASE" | grep -oE '[0-9]+(\.[0-9]+)+' | head -1 || true)
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="0.0.0"
            echo "::warning::No version number (like 1.4.0) in $SOURCE_ZIP; using 0.0.0."
          fi
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Building $SOURCE_ZIP as version $APP_VERSION"

      - name: Unpack the source zip into the repository root
        env:
          TARGET: .
        run: |
          set -e
          ZIP="$GITHUB_WORKSPACE/$SOURCE_ZIP"
          if [ ! -f "$ZIP" ]; then
            echo "::error::$SOURCE_ZIP was not found in the repository root. Upload the source zip there and run again."
            exit 1
          fi
          unzip -tq "$ZIP" > /dev/null || { echo "::error::$SOURCE_ZIP is not a valid zip file."; exit 1; }
          mkdir -p "$TARGET"
          cd "$TARGET"
          # Remove the old copy of every top-level file or folder the zip contains, so files deleted from the app don't linger.
          unzip -Z1 "$ZIP" | sed 's#^\./##' | cut -d/ -f1 | sort -u | while read -r top; do
            case "$top" in ""|"."|".."|".git"|".github"|"$SOURCE_ZIP") continue ;; esac
            rm -rf -- "$top"
          done
          unzip -oq "$ZIP"
          ls -A

      # Commits the unpacked source files so they can be browsed and read on GitHub.
      - name: Commit the source files to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source files are already up to date."
          else
            git commit -m "Update source files (build ${{ github.run_number }})"
            git push
          fi

      # The signing key is never stored in the repository: it is rebuilt from two repository secrets.
      - name: Load the signing key from repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing repository secrets KEYSTORE_BASE64 and/or KEYSTORE_PASSWORD. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Keep only the long base64 token, so stray labels, quotes or line breaks added by copy and paste don't matter.
          B64=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:cntrl:]' | grep -oE '[A-Za-z0-9+/=]{300,}' | head -1 || true)
          echo "KEYSTORE_BASE64 has ${#KEYSTORE_BASE64} characters in total, ${#B64} of them usable base64 (a correct value is about 3500)."
          if ! printf '%s' "$B64" | base64 -d > app/skyrimmm.keystore 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 is not valid base64. It was most likely cut off or changed when pasted. Delete the secret and paste the full value again."
            exit 1
          fi
          if ! keytool -list -keystore app/skyrimmm.keystore -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::The keystore could not be opened. Check that KEYSTORE_PASSWORD is exactly the password from signing-secrets.txt, and that KEYSTORE_BASE64 is complete."
            exit 1
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease -PversionCode=$(( $(date +%s) / 60 )) -PversionName=$APP_VERSION -PrepoSlug=${{ github.repository }} --stacktrace

      - name: Check the APK is valid and signed with the fixed key
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ls -l "$APK"
          "$BT/apksigner" verify --print-certs "$APK" | head -4
          "$BT/aapt2" dump badging "$APK" | head -1

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk ${{ env.APP_NAME }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SkyrimMM-apk
          path: ${{ env.APP_NAME }}.apk

      # Only after a successful build: remove the source zip from the repository root. The unpacked source stays; to update the app, upload a new zip.
      - name: Remove the source zip from the repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch -- "$SOURCE_ZIP"
          if git diff --cached --quiet; then
            echo "No source zip to remove."
          else
            git commit -m "Remove $SOURCE_ZIP after a successful build (build ${{ github.run_number }})"
            git pull --rebase
            git push
          fi
